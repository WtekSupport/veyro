[package]
name = "veyro-separation"
version = "0.1.0"
edition = "2021"
description = "Offline vocal/instrumental separation for Veyro (ONNX Runtime)"

[dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
thiserror = "2"
tracing = "0.1"
realfft = "3.4"

[features]
default = []
directml = ["ort/directml"]
cuda = ["ort/cuda"]
coreml = ["ort/coreml"]
