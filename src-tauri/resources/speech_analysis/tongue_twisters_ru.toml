[[presets]]
id = "ligurian_regulator"
title = "Лигурийский регулировщик"
text = "На дворе трава, на траве дрова, не руби дрова на траве двора, а то за траву дровами задавишь регулировщика, который в Лигурии за четвёртый квартал вылавливал лигурийских регулировщиков и лавировал, лавировал, да так и не вылавировал."

[[presets]]
