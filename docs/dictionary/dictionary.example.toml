# Example / reference dictionary — NOT shipped to new installs.
# Copy sections into your AppData dictionary.toml as needed.
# Fresh installs get an empty dictionary.default.toml (comments only).

vocabulary = [
  "Veyro",

  # Names you dictate often (replace with your own products, clients, or projects)
  "AcmeSuite",
  "Project Atlas",

  # Common services / tech (Latin spellings help Whisper)
  "ChatGPT",
  "OpenAI",
  "Claude",
  "GitHub",
  "Kubernetes",
  "PostgreSQL",
  "TypeScript",
  "YouTube",
  "Telegram",
  "Discord",
]

# Post-STT find/replace (empty value = remove the fragment)
[corrections]
# --- your product / project names (adjust keys to what Whisper actually outputs for you) ---
"acme suite" = "AcmeSuite"
"acme sweet" = "AcmeSuite"
"project atlas" = "Project Atlas"

# --- common tech mishearings (illustrative; add locale-specific keys in your live file) ---
"chat gpt" = "ChatGPT"
"chat g p t" = "ChatGPT"
"open ai" = "OpenAI"
"clod" = "Claude"
"git hub" = "GitHub"
"post gres" = "PostgreSQL"
"type script" = "TypeScript"

# --- typical Whisper hallucinations (any language) ---
"thanks for watching" = ""
"thank you for watching" = ""
"subscribe" = ""
"subtitles by" = ""
"amara.org" = ""

# Optional local Whisper decoding overrides
[whisper]
logprob_thold = -1.0
entropy_thold = 2.4
temperature_inc = 0.2
