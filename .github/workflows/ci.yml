name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "landingpage/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "landingpage/**"

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  rust:
    name: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: false
          shared-key: sherpa-1.13.8-v2
      - name: Install Linux build deps (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - run: cargo test --no-default-features --lib
      - name: Lint (cloud-only lib, no optional Silero/tch)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --no-default-features --lib
      - name: Lint Silero VAD (lib)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --no-default-features --features vad-silero --lib

  rust-sherpa:
    name: rust-sherpa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: false
          shared-key: sherpa-1.13.8-v3
      - name: Install Linux build deps (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            cmake
      - name: Fresh sherpa prebuilt (avoid partial rust-cache trees)
        run: rm -rf target/sherpa-onnx-prebuilt
      - run: cargo test --no-default-features --features local-sherpa-stt,vad-silero --lib
      - name: Lint sherpa STT (lib)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --no-default-features --features local-sherpa-stt --lib
