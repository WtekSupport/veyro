name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "landingpage/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "landingpage/**"

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  rust:
    name: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build deps (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - run: cargo test --no-default-features --lib
      - run: cargo clippy --no-default-features --lib -- -D warnings
      - name: Install cmake (sherpa-onnx)
        run: sudo apt-get install -y cmake
      - run: cargo test --no-default-features --features local-sherpa-stt --lib
      - run: cargo clippy --no-default-features --features local-sherpa-stt --lib -- -D warnings
